name: snapframe
description: "SnapFrame — a Gen Z / neo-brutalist mobile photobooth app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  camera: ^0.12.1
  confetti: ^0.8.0
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  gal: ^2.3.3
  go_router: ^17.3.0
  image: ^4.10.1
  intl: ^0.20.2
  json_annotation: ^4.12.0
  logger: ^2.8.0
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.0

dev_dependencies:
  build_runner: ^2.10.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  go_router_builder: ^4.5.0
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod: ^3.4.3
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/frames/

  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
          weight: 400
        - asset: assets/fonts/BricolageGrotesque.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque.ttf
          weight: 800
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 700
